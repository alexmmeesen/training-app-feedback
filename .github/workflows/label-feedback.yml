# Labels issues sent from the Break Ranks app. The app's link can't set labels for people other than the repo owner,
# so this reads the "Kind:" line the app writes at the end of the body. The issue text is only read, never run.
name: Label app feedback
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const tail = body.split('\n---\n').pop();
            if (!/^Screen:/m.test(tail) || !/^App:/m.test(tail)) return;
            const kind = (tail.match(/^Kind:\s*(.+)$/m) || [])[1]?.trim();
            const labels = ['app-feedback'];
            const byKind = { 'Bug': 'bug', 'Idea': 'idea', 'Looks off': 'looks-off' };
            if (byKind[kind]) labels.push(byKind[kind]);
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels });
